name: MEeL CI
on:
  push:
    branches: ["main", "master", "develop", "Experiment"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:
    inputs:
      debug_enabled:
        description: "Enable debug logging"
        required: false
        default: false
        type: boolean
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  checks: write
  pull-requests: write
defaults:
  run:
    shell: bash
jobs:
  php-syntax:
    name: PHP Syntax (php -l)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ["8.1", "8.2", "8.3"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Setup PHP ${{ matrix.php-version }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: none
          tools: none
      - name: PHP Syntax Check (php -l)
        run: |
          failed=0
          count=0
          while IFS= read -r -d '' file; do
            if ! php -l "$file" 2>&1; then
              echo "❌ Syntax error in: $file"
              failed=1
            fi
            count=$((count + 1))
          done < <(find . -name '*.php' -not -path './vendor/*' -not -path './.git/*' -not -path './assets/dict/*' -print0)
          if [ $failed -eq 1 ]; then exit 1; fi
          echo "✅ All $count PHP files passed syntax check on PHP ${{ matrix.php-version }}."
  functional-tests:
    name: Functional Tests
    runs-on: ubuntu-latest
    needs: php-syntax
    if: always()
    strategy:
      fail-fast: false
      matrix:
        php-version: ["8.2"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Setup PHP ${{ matrix.php-version }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: none
          tools: none
      - name: Run Functional Tests
        run: |
          if [ -f tests/functional_test.php ]; then
            # Catat rc via || (bukan baris terpisah) karena run: di GitHub Actions
            # berjalan dengan `bash -e` — perintah yang return 1 langsung menghentikan
            # shell sebelum rc=$? sempat dieksekusi; || membuatnya exempt dari set -e.
            rc=0
            php tests/functional_test.php || rc=$?
            # 1 = lulus dengan peringatan (storage/HDD belum ter-mount, dll.) → tetap hijau
            if [ "$rc" -gt 1 ]; then exit "$rc"; fi
            if [ "$rc" -eq 1 ]; then echo "⚠️  Functional test passed with warnings (exit 1)"; fi
          else
            echo "⚠️  Functional test not found, skipping."
          fi
  security-tests:
    name: Security Tests
    runs-on: ubuntu-latest
    needs: php-syntax
    if: always()
    strategy:
      fail-fast: false
      matrix:
        php-version: ["8.2"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Setup PHP ${{ matrix.php-version }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: none
          tools: none
      - name: Run Security Tests
        run: |
          if [ -f tests/security_test.php ]; then
            # Catat rc via || (bukan baris terpisah) karena run: di GitHub Actions
            # berjalan dengan `bash -e` — perintah yang return 1 langsung menghentikan
            # shell sebelum rc=$? sempat dieksekusi; || membuatnya exempt dari set -e.
            rc=0
            php tests/security_test.php || rc=$?
            # 1 = lulus dengan peringatan (storage/HDD belum ter-mount, dll.) → tetap hijau
            if [ "$rc" -gt 1 ]; then exit "$rc"; fi
            if [ "$rc" -eq 1 ]; then echo "⚠️  Security test passed with warnings (exit 1)"; fi
          else
            echo "⚠️  Security test not found, skipping."
          fi
  phpunit-tests:
    name: PHPUnit Unit Tests
    runs-on: ubuntu-latest
    needs: php-syntax
    if: always()
    strategy:
      fail-fast: false
      matrix:
        php-version: ["8.2"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Setup PHP ${{ matrix.php-version }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: none
          tools: composer
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Get Composer Cache Directory
        id: composer-cache
        run: |
          echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer Dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.json') }}
          restore-keys: |
            ${{ runner.os }}-composer-
      - name: Install Composer Dependencies
        run: |
          if [ -f composer.json ]; then
            composer install --no-progress --no-interaction --prefer-dist
          else
            echo "⚠️  composer.json not found, skipping."
          fi
      - name: Install mecab (Japanese tests dependency)
        run: |
          sudo apt-get update
          sudo apt-get install -y mecab
          # Nama paket kamus berbeda antar versi Ubuntu:
          #   < 20.04: mecab-ipadic-utf8 ; >= 20.04: mecab-ipadic
          sudo apt-get install -y mecab-ipadic-utf8 || sudo apt-get install -y mecab-ipadic || true
          echo "テスト" | mecab || echo "⚠️  mecab gagal diuji — Japanese tests akan skip"
      - name: Verify JS harness prerequisites
        run: |
          # Guard anti-skip-senyap: kalau ada tests/js/*.harness.js tapi Node
          # tidak tersedia, test akan markTestSkipped() dan suite tetap hijau
          # tanpa benar-benar menguji apa pun. Di runner GitHub Node sudah
          # diinstall di langkah "Setup Node.js"; langkah ini hanya memastikan
          # keadaan itu, dan GAGAL kalau suatu saat langkahnya hilang.
          shopt -s nullglob
          harnesses=(tests/js/*.harness.js)
          if [ ${#harnesses[@]} -eq 0 ]; then
            echo "ℹ️  Tidak ada harness JS — tidak ada yang perlu diverifikasi."
            exit 0
          fi
          printf '   %s\n' "${harnesses[@]}"
          if ! command -v node >/dev/null 2>&1; then
            echo "❌ Ada ${#harnesses[@]} harness JS tapi Node tidak ada di runner."
            echo "   Test akan markTestSkipped() — suite hijau palsu. Tambahkan langkah setup-node."
            exit 1
          fi
          echo "✅ Node $(node --version) tersedia untuk ${#harnesses[@]} harness."
      - name: Run PHPUnit Tests
        run: |
          if [ -f vendor/bin/phpunit ]; then
            # Hanya suite unit: integration tests membutuhkan MySQL + data nyata
            # yang tidak tersedia di runner (lihat docs/en/testing.md).
            php vendor/bin/phpunit --no-coverage --verbose --testsuite='MEeL Core Unit Tests'
          else
            echo "⚠️  PHPUnit not installed, skipping."
          fi
  phpunit-integration-tests:
    name: PHPUnit Integration Tests
    runs-on: ubuntu-latest
    needs: php-syntax
    if: always()
    strategy:
      fail-fast: false
      matrix:
        php-version: ["8.2"]
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup PHP ${{ matrix.php-version }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: none
          extensions: mysqli
          tools: composer

      - name: Install Composer Dependencies
        run: |
          if [ -f composer.json ]; then
            composer install --no-progress --no-interaction --prefer-dist
          else
            echo "⚠️  composer.json not found, skipping."
          fi

      - name: Run PHPUnit Integration Tests
        env:
          MEEL_TEST_DB_HOST: 127.0.0.1
          MEEL_TEST_DB_USER: root
          MEEL_TEST_DB_PASS: root
        run: |
          if [ -f vendor/bin/phpunit ]; then
            php vendor/bin/phpunit --no-coverage --verbose --testsuite='MEeL Integration Tests'
          else
            echo "⚠️  PHPUnit not installed, skipping."
          fi
  migration-test:
    name: Migration Test
    runs-on: ubuntu-latest
    needs: php-syntax
    if: always()
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: meel_migration_check
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          coverage: none
          extensions: mysqli

      - name: Import schema.sql (fresh install path)
        run: |
          mysql -h 127.0.0.1 -u root -proot meel_migration_check < database/schema.sql
          echo "✅ schema.sql import OK"

      - name: Run migrate.php on top of existing schema (upgrade path)
        run: |
          set -e
          # Konvensi auth/config.php. Settings contoh dipakai supaya runner
          # tidak butuh kredensial nyata.
          if [ -f auth/settings.php ]; then
            echo "ℹ️  auth/settings.php ada di repo — memastikan tidak menimpa."
          else
            cp auth/settings.example.php auth/settings.php
            sed -i "s/define('DB_HOST'.*/define('DB_HOST', '127.0.0.1');/" auth/settings.php || true
            sed -i "s/define('DB_NAME'.*/define('DB_NAME', 'meel_migration_check');/" auth/settings.php || true
            sed -i "s/define('DB_USER'.*/define('DB_USER', 'root');/" auth/settings.php || true
            sed -i "s/define('DB_PASS'.*/define('DB_PASS', 'root');/" auth/settings.php || true
          fi

          echo "── migrate.php run #1 ──"
          php database/migrate.php

          echo "── migrate.php run #2 (harus idempoten) ──"
          OUT=$(php database/migrate.php)
          echo "$OUT"
          if ! echo "$OUT" | grep -q "up-to-date"; then
            echo "❌ Migrasi TIDAK idempoten — run kedua masih ada migrasi baru."
            exit 1
          fi
          echo "✅ migrate.php idempoten"

      - name: Verify schema parity (upgrade path vs fresh install path)
        run: |
          # Konvensi T9: hasil upgrade (migrate.php di atas skema LAMA)
          # harus identik dengan instalasi baru (import schema.sql).
          #
          # Penting: DB pertama dibangun dari schema.sql, jadi keduanya
          # akan selalu sama — itu tidak membuktikan apa pun. Yang diuji
          # di sini adalah jalur UPGRADE: mulai dari skema versi LAMA
          # (tanpa kolom v6+), lalu jalankan migrate.php. Kalau ada
          # migrasi yang lupa ditulis balik ke schema.sql, hasil upgrade
          # akan punya kolom yang tidak ada di instalasi baru.
          php scripts/ci/schema-parity-check.php

  # ─── Job 5: HTACCESS & Integrity Check ───
  htaccess-check:
    name: HTACCESS & Integrity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Check HTACCESS Protection
        run: |
          echo "🔍 Checking sensitive directories have .htaccess protection..."
          sensitive_dirs=(
            "controllers" "modules" "logs" "tests" "database"
            "auth" "err" "temp" "data_drive" "books/upload"
            "music/upload" "video/upload" "drive/templates"
            "docs/partials" "partials" "admin" "scripts"
          )
          missing=0
          for dir in "${sensitive_dirs[@]}"; do
            if [ -d "$dir" ] && [ ! -f "$dir/.htaccess" ]; then
              echo "❌ Missing .htaccess in: $dir/"
              missing=1
            fi
          done
          if [ $missing -eq 1 ]; then exit 1; fi
          echo "✅ All ${#sensitive_dirs[@]} sensitive directories have .htaccess protection."
      - name: Check Critical File Permissions
        run: |
          echo "🔍 Checking critical file permissions..."
          critical_scripts=(
            "auth/config.php" "auth/auth.php" "auth/login.php"
            "auth/register.php" "auth/logout.php"
            "index.php" ".htaccess"
          )
          issues=0
          for file in "${critical_scripts[@]}"; do
            if [ -f "$file" ]; then
              perms=$(stat -c "%a" "$file")
              if [ "$perms" != "644" ] && [ "$perms" != "755" ] && [ "$perms" != "750" ]; then
                echo "⚠️  Unusual permissions ($perms) on: $file"
              fi
            else
              echo "ℹ️  $file not found (may not be required)"
            fi
          done
          echo "✅ Permission check complete."
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Install shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
      - name: Lint shell scripts
        run: |
          echo "🔍 Menjalankan shellcheck..."
          mapfile -t shell_files < <(
            find . -type f -name '*.sh' \
              -not -path './vendor/*' \
              -not -path './node_modules/*' \
              -not -path './.git/*' | sort
          )
          if [ ${#shell_files[@]} -eq 0 ]; then
            echo "ℹ️  Tidak ada skrip .sh — tidak ada yang perlu dianalisis."
            exit 0
          fi
          printf '   %s\n' "${shell_files[@]}"
          shellcheck -S warning "${shell_files[@]}"
          echo "✅ Shellcheck bersih pada ${#shell_files[@]} skrip (severity: warning)."
  deploy-check:
    name: Deployment Check
    runs-on: ubuntu-latest
    needs: php-syntax
    if: always()
    strategy:
      fail-fast: false
      matrix:
        php-version: ["8.2"]
    env:
      STAGING_URL: ${{ secrets.STAGING_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Setup PHP ${{ matrix.php-version }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: none
          tools: none
      - name: Simulate storage layout (temp HDD + upload dirs)
        run: |
          # check_deploy memverifikasi MEEL_HDD_BASE, upload symlinks dan
          # .htaccess upload dirs. Runner tidak punya /media storage, jadi kita
          # buat layout tiruan yang valid di $RUNNER_TEMP lalu arahkan upload
          # dir ke sana (check_deploy memeriksa target symlink).
          #
          # Sejak refactor portabilitas: books/music/video/upload adalah folder
          # NYATA ter-track di repo (placeholder .gitkeep/.htaccess), bukan
          # symlink. Di sini folder-nya di-remove lalu diganti symlink ke
          # storage temp — mensimulasikan layout deploy produksi (symlink dibuat
          # saat deploy, TIDAK pernah di-commit).
          #
          # data_drive/public & data_drive/private_admins juga folder nyata
          # ter-track — modul Drive membaca storage langsung dari
          # MEEL_HDD_DRIVE (disimulasikan lewat --hdd), jadi tidak ada symlink
          # yang perlu diarahkan ke temp untuk Drive.
          HDD="$RUNNER_TEMP/meel_storage/media"
          # check_deploy menganggap subdirektori non-auto-create (music/books)
          # sebagai FAIL jika hilang — buat struktur lengkap seperti install.sh.
          mkdir -p "$HDD/video/upload/video" "$HDD/video/upload/thumbnail" \
                   "$HDD/music/upload/file" "$HDD/music/upload/thumbnail" \
                   "$HDD/books/upload/pdf" "$HDD/books/upload/thumbnail" \
                   "$HDD/drive/private_admins"
          # .htaccess hardening untuk tiap upload dir (pola sama dengan deploy)
          for m in video music books; do
            cp "${{ github.workspace }}/data_drive/.htaccess" "$HDD/$m/upload/.htaccess" 2>/dev/null || true
            # Upload dir di repo adalah folder nyata → ganti dengan symlink ke storage temp
            rm -rf "${{ github.workspace }}/$m/upload"
            ln -s "$HDD/$m/upload" "${{ github.workspace }}/$m/upload"
          done

          # settings.php dibutuhkan check_deploy (di-copy dari contoh)
          cp "${{ github.workspace }}/auth/settings.example.php" "${{ github.workspace }}/auth/settings.php" 2>/dev/null || true

          echo "HDD=$HDD" >> "$GITHUB_ENV"

      - name: Run Deployment Check
        run: |
          if [ -f tests/check_deploy.php ]; then
            php tests/check_deploy.php --no-color --hdd="$HDD" || exit $?
          else
            echo "⚠️  Deployment check not found, skipping."
          fi

      - name: Verify Private Drive 403 (staging)
        if: env.STAGING_URL != ''
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            "$STAGING_URL/data_drive/private_admins/" || true)
          [ "$code" = "403" ] || { echo "Expected 403, got $code"; exit 1; }
  drive-storage-check:
    name: Drive Storage Integrity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Reject symlinks inside data_drive/
        run: |
          echo "🔍 Memeriksa data_drive/public & data_drive/private_admins (harus folder nyata)..."
          # 1) Index check: mode 120000 = symlink ter-track. Git index adalah
          #    sumber kebenaran apa yang akan ter-commit — bukan sekadar
          #    working tree.
          tracked=$(git ls-files -s data_drive/ | awk '$1 == "120000" {print $4}')
          if [ -n "$tracked" ]; then
            echo "❌ Symlink ter-track di data_drive/ (dilarang):"
            echo "$tracked" | sed 's/^/   - /'
            echo ""
            echo "Perbaikan: hapus symlink; untuk storage eksternal set MEEL_HDD_DRIVE"
            echo "di auth/settings.php (modul Drive membaca langsung, tanpa symlink)."
            exit 1
          fi
          # 2) Working-tree check: symlink yang muncul di filesystem (mis. hasil
          #    deploy lokal yang keliru di-commit via -f).
          found=0
          while IFS= read -r -d '' link; do
            echo "❌ Symlink di data_drive/: $link -> $(readlink "$link")"
            found=1
          done < <(find data_drive -type l -print0)
          [ $found -eq 1 ] && exit 1
          echo "✅ Tidak ada symlink di data_drive/ (index & working tree bersih)."
  ci-summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs:
      [
        php-syntax,
        functional-tests,
        security-tests,
        phpunit-tests,
        phpunit-integration-tests,
        migration-test,
        htaccess-check,
        shellcheck,
        deploy-check,
        drive-storage-check,
      ]
    if: always()
    steps:
      - name: Generate Job Status Summary
        run: |
          echo "## 📊 CI Pipeline Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          report_job() {
            local name="$1"
            local result="$2"
            if [ "$result" == "success" ]; then
              echo "| ✅ $name | ✅ Passed |" >> $GITHUB_STEP_SUMMARY
            elif [ "$result" == "cancelled" ]; then
              echo "| ⏭️  $name | ⏭️ Skipped |" >> $GITHUB_STEP_SUMMARY
            else
              echo "| ❌ $name | ❌ Failed |" >> $GITHUB_STEP_SUMMARY
            fi
          }
          report_job "PHP Syntax (8.1)" "${{ needs.php-syntax.result }}"
          report_job "PHP Syntax (8.2)" "${{ needs.php-syntax.result }}"
          report_job "PHP Syntax (8.3)" "${{ needs.php-syntax.result }}"
          report_job "Functional Tests" "${{ needs.functional-tests.result }}"
          report_job "Security Tests" "${{ needs.security-tests.result }}"
          report_job "PHPUnit Unit Tests" "${{ needs.phpunit-tests.result }}"
          report_job "PHPUnit Integration Tests" "${{ needs.phpunit-integration-tests.result }}"
          report_job "Migration Test" "${{ needs.migration-test.result }}"
          report_job "HTACCESS & Integrity" "${{ needs.htaccess-check.result }}"
          report_job "ShellCheck" "${{ needs.shellcheck.result }}"
          report_job "Deployment Check" "${{ needs.deploy-check.result }}"
          report_job "Drive Storage Integrity" "${{ needs.drive-storage-check.result }}"
          {
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "### ⚡ Optimizations applied" >> "$GITHUB_STEP_SUMMARY"
            cat <<'EOF'
          - **Parallel jobs** — syntax check, tests, security, and integrity run in parallel
          - **Matrix strategy** — syntax check across PHP 8.1, 8.2, 8.3
          - **Shallow clone** — `fetch-depth: 1` for faster checkout
          - **Concurrency** — cancels redundant runs on the same branch
          - **Xdebug disabled** — `coverage: none` for faster PHP execution
          - **Least privilege** — minimal `GITHUB_TOKEN` permissions
          - **Fail-fast disabled** — all PHP versions run even if one fails
          - **Job dependency** — functional/security tests wait for syntax check
          EOF
          } >> "$GITHUB_STEP_SUMMARY"
